<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Video</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: rgba(20, 25, 50, 0.85);
            border: 1px solid rgba(77, 166, 255, 0.25);
            border-radius: 14px; padding: 30px; width: 100%; max-width: 880px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        h1 { color: #4da6ff; font-size: 1.6em; margin-bottom: 6px; }
        .sub { color: #9aa4c0; margin-bottom: 22px; font-size: 0.95em; }
        label { display: block; margin: 14px 0 6px; color: #b8c0d8; font-size: 0.9em; }
        input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(120,140,200,0.35); background: rgba(10,14,35,0.7);
            color: #fff; font-size: 1em;
        }
        button {
            margin-top: 20px; width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: #4da6ff; color: #06122a; font-weight: 700; font-size: 1.05em; cursor: pointer;
        }
        button:hover { background: #6fb8ff; }
        button:disabled { opacity: 0.6; cursor: default; }
        .error { color: #ff7a7a; margin-top: 14px; min-height: 1.2em; }
        .hidden { display: none; }
        .videowrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
        .videowrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        /* Masks over the top and bottom eighths of the player. The top band covers
           YouTube's title/channel link, the bottom covers "Watch on YouTube" and the
           logo. They always intercept clicks — --mask-opacity only controls how
           visible they are, so at 0 the corner still cannot be clicked through. */
        /* Always fully transparent — the point is intercepting the click, not hiding
           anything. --mask-display is set from the per-video setting. */
        .vmask { display: var(--mask-display, block); position: absolute; height: 12.5%;
                 background: transparent; z-index: 5; }
        /* Top band: covers only the LEFT portion — the channel avatar, video title and
           uploader name, all of which link out to YouTube. The right end of that band
           holds volume, CC and settings, so it is deliberately left clear: captions
           are an accessibility obligation and must stay reachable. */
        .vmask-top { top: 0; left: 0; width: var(--mask-top-width, 70%); }
        /* Bottom band: full width — share, Watch Later, the YouTube logo and the
           "Watch on YouTube" link all live here. */
        .vmask-bottom { bottom: 0; left: 0; right: 0; }
        .status { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; font-size: 0.95em; }
        .bar { flex: 1 1 220px; height: 12px; background: rgba(10,14,35,0.8); border-radius: 6px; overflow: hidden; min-width: 180px; }
        .bar > div { height: 100%; width: 0%; background: linear-gradient(90deg,#4da6ff,#7ee0c0); transition: width 0.4s; }
        .pct { font-weight: 700; color: #7ee0c0; }
        .done { color: #7ee0c0; font-weight: 700; }
        .who { color: #9aa4c0; font-size: 0.85em; margin-top: 6px; }

        /* ---- password reveal ("eye") ---- */
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 48px; }
        /* Edge/Chromium add their own reveal (and clear) control inside password fields.
           Hide them so the student sees one eye, not two. */
        .pw-wrap input::-ms-reveal,
        .pw-wrap input::-ms-clear { display: none; width: 0; height: 0; }
        .eye {
            position: absolute; top: 0; right: 0; height: 100%; width: 44px;
            margin: 0; padding: 0; width: 44px;
            background: transparent; border: none; border-radius: 0 8px 8px 0;
            color: #9aa4c0; font-size: 1em; font-weight: 400; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .eye:hover { background: transparent; color: #4da6ff; }
        .eye:focus-visible { outline: 2px solid #4da6ff; outline-offset: -3px; border-radius: 8px; }
        .eye svg { width: 20px; height: 20px; display: block; }

        /* ---- bottom row: save note on the left, full-screen button lower right ---- */
        .footrow { margin-top: 10px; display: flex; align-items: center; gap: 14px; }
        .footrow .who { margin-top: 0; flex: 1 1 auto; }
        .fsbtn {
            margin: 0; width: auto; flex: 0 0 auto;
            padding: 9px 14px; border-radius: 8px;
            background: rgba(10,14,35,0.7);
            border: 1px solid rgba(120,140,200,0.35);
            color: #b8c0d8; font-size: 0.85em; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .fsbtn:hover { background: rgba(77,166,255,0.18); color: #fff; border-color: rgba(77,166,255,0.5); }
        .fsbtn:focus-visible { outline: 2px solid #4da6ff; outline-offset: 2px; }
        .fsbtn svg { width: 16px; height: 16px; display: block; }

        /* ---- full-screen layout: banner on top, info bar below, video fills the middle ----
           Sized with viewport units rather than percentage heights on purpose: Firefox
           applies !important rules to the element it puts full screen, which can defeat a
           flex/percentage height chain. This works under block, flex or grid layout.
           --fs-chrome is the vertical space taken by the title, ID line, progress bar and
           footer row — nudge it if you change any of those. */
        .card.fs-active {
            --fs-chrome: 200px;
            width: 100vw; height: 100vh; max-width: none;
            border: none; border-radius: 0; box-shadow: none;
            background: #05070f;
            padding: 12px 20px;
            overflow: hidden;
        }
        .card.fs-active h1 { font-size: 1.2em; margin-bottom: 2px; }
        .card.fs-active .videowrap {
            /* Largest 16:9 box that fits both the leftover height and the screen width. */
            height: min(calc(100vh - var(--fs-chrome)), calc((100vw - 40px) * 9 / 16));
            width: auto;
            aspect-ratio: 16 / 9;
            margin: 10px auto;
            border-radius: 6px;
        }
        .card.fs-active .status { margin-top: 0; }
        .card.fs-active .footrow { margin-top: 8px; }

        @media (prefers-reduced-motion: reduce) {
            .bar > div { transition: none; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- LOGIN -->
        <div id="loginView">
            <h1 id="loginTitle">Course Video</h1>
            <p class="sub">Sign in to watch. Your viewing is recorded for your instructor.</p>
            <label for="name">Your name</label>
            <input type="text" id="name" placeholder="Enter your name" autocomplete="off">
            <label for="studentID">Student ID</label>
            <input type="text" id="studentID" placeholder="Enter your student ID" autocomplete="off">
            <label for="password">Video password</label>
            <div class="pw-wrap">
                <input type="password" id="password" placeholder="Enter password" autocomplete="off">
                <button type="button" class="eye" id="pwToggle" onclick="togglePassword()"
                        aria-label="Show password" aria-pressed="false" title="Show password"></button>
            </div>
            <button id="loginBtn" onclick="startSession()">Watch Video</button>
            <div class="error" id="loginError"></div>
        </div>

        <!-- PLAYER -->
        <div id="playerView" class="hidden">
            <h1 id="videoTitle">Video</h1>
            <p class="who" id="whoLine"></p>
            <div id="videoStage"><div class="videowrap"><div id="ytplayer"></div><div class="vmask vmask-top" id="vmaskTop"></div><div class="vmask vmask-bottom" id="vmaskBottom"></div></div></div>
            <div class="status">
                <span>Watched:</span>
                <div class="bar"><div id="progressFill"></div></div>
                <span class="pct" id="progressPct">0%</span>
                <span class="done hidden" id="doneTag">✓ Complete</span>
            </div>
            <div class="footrow">
                <p class="who" id="saveLine">Progress saves automatically.</p>
                <button type="button" class="fsbtn" id="fsBtn" onclick="toggleFullscreen()"
                        aria-pressed="false" title="Full screen (F11)">
                    <span class="fsIcon"></span><span class="fsLabel">Full screen</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ---- Firebase (same project as the quizzes/dashboard) ----
        const firebaseConfig = {
            apiKey: "AIzaSyApECjlGt_AgK9853JGWsyPuWuXIRyRQOA",
            authDomain: "astronomy-course.firebaseapp.com",
            projectId: "astronomy-course",
            storageBucket: "astronomy-course.firebasestorage.app",
            messagingSenderId: "84123424550",
            appId: "1:84123424550:web:f6eab6a447d480cedc13e7"
        };
        let db = null;
        if (typeof firebase !== 'undefined') {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            } catch (e) { console.error('Firebase init failed:', e); }
        } else {
            console.warn('Firebase SDK not loaded (normal in a sandboxed preview; works on GitHub Pages).');
        }

        // ---- The video's quiz id comes from the link: video.html?qid=VIDEO01 ----
        const QID = new URLSearchParams(location.search).get('qid') || '';

        // ---- Session / tracking state ----
        const CELL_SECONDS = 2;            // one coverage cell per 2 seconds
        const POLL_MS = 700;               // how often we sample the player
        const SAVE_EVERY_MS = 8000;        // throttle Firestore writes
        const COMPLETE_THRESHOLD = 1.0;    // complete means 100% of the video watched


        let session = null;   // { className, quizName, databaseId, youtubeId, name, studentID, docId, attempt, maxAttempts, isReview, reviewNum }
        let player = null;
        let ytApiReady = false;
        let pendingVideoId = null;

        let duration = 0, numCells = 0;
        let covered = null;            // Uint8Array of 0/1 per cell
        let watchTime = 0;             // real seconds watched
        let lastTime = -1;             // previous sampled currentTime
        let dirty = false;
        let lastSave = 0;
        let firstSeen = null;

        // ============== LOGIN ==============
        async function startSession() {
            const errEl = document.getElementById('loginError');
            errEl.textContent = '';
            const name = document.getElementById('name').value.trim();
            const studentID = document.getElementById('studentID').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');

            if (!QID) { errEl.textContent = 'This link is missing its video id (?qid=...). Ask your instructor for the correct link.'; return; }
            if (!name || !studentID || !password) { errEl.textContent = 'Please fill in all fields.'; return; }
            if (!db) { errEl.textContent = 'Cannot reach the database. Try again, or use the link your instructor provided.'; return; }

            btn.disabled = true; btn.textContent = 'Checking…';
            try {
                // Resolve videoId + password -> the exact video (separate from quizzes)
                const snap = await db.collection('videos')
                    .where('videoId', '==', QID)
                    .where('password', '==', password)
                    .limit(1).get();

                if (snap.empty) { errEl.textContent = 'Incorrect password for this video.'; btn.disabled = false; btn.textContent = 'Watch Video'; return; }

                const q = snap.docs[0].data();
                const youtubeId = q.youtubeId || q.youtubeID || '';
                if (!youtubeId) { errEl.textContent = 'No video has been attached to this entry yet. Ask your instructor.'; btn.disabled = false; btn.textContent = 'Watch Video'; return; }

                // Load this video's settings (ID format + availability window)
                let settings = {};
                try {
                    const sDoc = await db.collection('videoSettings').doc(`${q.className}_${q.name}`).get();
                    if (sDoc.exists) settings = sDoc.data();
                } catch (e) { /* settings are optional */ }

                // Masking on/off. Absent means ON — the protective default, and what
                // every video created before this setting existed should get.
                {
                    const on = settings.maskEnabled !== false;
                    document.querySelector('.card').style.setProperty('--mask-display', on ? 'block' : 'none');
                }

                // Enforce Student ID rule, if any
                const idv = settings.idValidation;
                if (idv && idv.type && idv.type !== 'none' && idv.value) {
                    let valid = true, msg = 'Student ID is not in the required format';
                    if (idv.type === 'digits') {
                        const n = parseInt(idv.value, 10);
                        valid = new RegExp('^\\d{' + n + '}$').test(studentID);
                        msg = `Student ID must be exactly ${n} digits`;
                    } else if (idv.type === 'startsWith') {
                        valid = studentID.startsWith(idv.value); msg = `Student ID must start with "${idv.value}"`;
                    } else if (idv.type === 'regex') {
                        try { valid = new RegExp(idv.value).test(studentID); } catch (e) { valid = true; }
                    }
                    if (!valid) { errEl.textContent = msg; btn.disabled = false; btn.textContent = 'Watch Video'; return; }
                }

                // Enforce availability window, if set.
                //   start      — nothing before this
                //   stop       — graded attempts end here
                //   reviewStop — ungraded re-watching ends here (blank = same as stop)
                const a = settings.availability || {};
                const now = new Date();
                const hardStop = a.reviewStop || a.stop;   // the real lock-out date
                if (a.start && now < new Date(a.start)) {
                    errEl.textContent = `This video opens ${new Date(a.start).toLocaleString()}.`;
                    btn.disabled = false; btn.textContent = 'Watch Video'; return;
                }
                if (hardStop && now > new Date(hardStop)) {
                    errEl.textContent = `This video closed ${new Date(hardStop).toLocaleString()}.`;
                    btn.disabled = false; btn.textContent = 'Watch Video'; return;
                }
                // Past the credit date but still inside the review window: watchable, never graded.
                const creditClosed = !!(a.stop && now > new Date(a.stop));

                const safeId = studentID.replace(/[^A-Za-z0-9_-]/g, '_');
                const databaseId = `${q.className}_${q.name}`;
                const maxAttempts = parseInt(settings.maxAttempts, 10) || 1;

                // ---- Which attempt is this? ----
                // Every login starts a NEW attempt. Nothing is ever resumed or overwritten.
                let prior = [];
                try {
                    const ps = await db.collection('videoProgress')
                        .where('databaseId', '==', databaseId)
                        .where('studentID', '==', studentID)
                        .get();
                    prior = ps.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch (e) {
                    // Don't silently hand out a free attempt if the lookup fails.
                    errEl.textContent = 'Could not verify your attempt count. Please try again.';
                    btn.disabled = false; btn.textContent = 'Watch Video'; return;
                }

                // Docs written before attempt tracking existed have no `attempt` field -> treat as 1.
                // Review sessions are NOT attempts and must never inflate the attempt number.
                const priorAttempts = prior.filter(r => r.review !== true);
                const priorReviews  = prior.filter(r => r.review === true);
                const highest = priorAttempts.reduce((m, r) => Math.max(m, r.attempt || 1), 0);

                // Two ways into an ungraded review session:
                //   1. attempts are used up
                //   2. the credit window has closed (unused attempts are forfeit — the due date stands)
                // Either way the student can still watch until reviewStop; nothing is graded.
                const attemptsUsedUp = highest >= maxAttempts;
                const isReview = attemptsUsedUp || creditClosed;
                let attempt = 0, reviewNum = 0, docId;
                if (isReview) {
                    reviewNum = priorReviews.reduce((m, r) => Math.max(m, r.reviewNum || 0), 0) + 1;
                    docId = `${databaseId}__${safeId}__r${reviewNum}`;
                } else {
                    attempt = highest + 1;
                    docId = `${databaseId}__${safeId}__a${attempt}`;   // a NEW document, never an overwrite
                }

                session = {
                    className: q.className,
                    quizName: q.name,
                    databaseId,
                    youtubeId,
                    name, studentID,
                    docId, attempt, maxAttempts,
                    isReview, reviewNum
                };

                // Every attempt starts from nothing.
                covered = null; watchTime = 0; lastTime = -1; firstSeen = Date.now(); dirty = false; lastSave = 0;

                // Claim the attempt immediately so closing the tab can't win a free retry.
                try {
                    const claim = {
                        className: q.className, quizName: q.name, databaseId, youtubeId,
                        studentName: name, studentID,
                        maxAttempts, review: isReview,
                        coverage: '', cellsCovered: 0, percentWatched: 0, watchTime: 0,
                        completed: false, firstSeen, lastUpdated: firstSeen
                    };
                    if (isReview) claim.reviewNum = reviewNum; else claim.attempt = attempt;
                    await db.collection('videoProgress').doc(docId).set(claim);
                } catch (e) {
                    errEl.textContent = 'Could not start your ' + (isReview ? 'review session' : 'attempt') + ': ' + e.message;
                    btn.disabled = false; btn.textContent = 'Watch Video'; session = null; return;
                }

                document.getElementById('videoTitle').textContent = q.name;
                let whoTail, saveText;
                if (!isReview) {
                    whoTail = `Attempt ${attempt} of ${maxAttempts}`;
                    saveText = 'Progress saves automatically.';
                } else if (attemptsUsedUp) {
                    whoTail = `Attempts used (${maxAttempts} of ${maxAttempts}) — reviewing`;
                    saveText = 'Review session — watch as much as you like. Your grade is already recorded and will not change.';
                } else {
                    // Credit window closed with attempts still unused.
                    whoTail = 'Assignment closed — reviewing';
                    saveText = `Review session — the graded window closed ${new Date(a.stop).toLocaleString()}, so this viewing is not graded. Watch as much as you like.`;
                }
                document.getElementById('whoLine').textContent =
                    `${q.className} · ${name} · ID ${studentID} · ${whoTail}`;
                document.getElementById('saveLine').textContent = saveText;
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('playerView').classList.remove('hidden');

                startVideo(youtubeId);
            } catch (error) {
                console.error('Login error:', error);
                errEl.textContent = 'Something went wrong: ' + error.message;
                btn.disabled = false; btn.textContent = 'Watch Video';
            }
        }

        // ============== Password reveal ==============
        const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        const ICON_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

        function togglePassword() {
            const inp = document.getElementById('password');
            const btn = document.getElementById('pwToggle');
            const reveal = inp.type === 'password';
            let pos = null;
            try { pos = inp.selectionStart; } catch (e) { /* not all browsers allow this on password inputs */ }
            inp.type = reveal ? 'text' : 'password';
            btn.innerHTML = reveal ? ICON_EYE_OFF : ICON_EYE;
            btn.setAttribute('aria-pressed', reveal ? 'true' : 'false');
            btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
            btn.setAttribute('title', reveal ? 'Hide password' : 'Show password');
            inp.focus();
            if (pos !== null) { try { inp.setSelectionRange(pos, pos); } catch (e) {} }
        }
        document.getElementById('pwToggle').innerHTML = ICON_EYE;

        // ============== Full screen (keeps the banner and info bar) ==============
        // We full-screen the whole card, not the iframe, so the student keeps the
        // class/name/attempt banner on top and the progress bar underneath.
        const ICON_FS_ON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
        const ICON_FS_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';

        const cardEl = document.querySelector('.card');

        function fsElement() {
            return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
        }
        function requestFS(el) {
            const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
            if (!fn) return;
            try { const p = fn.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
        }
        function exitFS() {
            const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
            if (!fn) return;
            try { const p = fn.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) {}
        }
        function toggleFullscreen() {
            if (fsElement()) exitFS(); else requestFS(cardEl);
        }

        // Drive the styling off the actual fullscreen state, so Escape / the browser
        // chrome / the system menu all leave the page in a consistent condition.
        function syncFullscreenUI() {
            const on = !!fsElement();
            cardEl.classList.toggle('fs-active', on);
            const btn = document.getElementById('fsBtn');
            btn.querySelector('.fsIcon').innerHTML = on ? ICON_FS_OFF : ICON_FS_ON;
            btn.querySelector('.fsLabel').textContent = on ? 'Exit full screen' : 'Full screen';
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            btn.setAttribute('title', on ? 'Exit full screen (Esc or F11)' : 'Full screen (F11)');
        }
        document.addEventListener('fullscreenchange', syncFullscreenUI);
        document.addEventListener('webkitfullscreenchange', syncFullscreenUI);
        document.addEventListener('MSFullscreenChange', syncFullscreenUI);
        syncFullscreenUI();

        // Take over F11 while the video is on screen, so it expands the framed view
        // instead of the browser window. Some browsers reserve F11 and will not hand
        // it over; the button always works.
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'F11' && e.keyCode !== 122) return;
            if (document.getElementById('playerView').classList.contains('hidden')) return;
            e.preventDefault();
            toggleFullscreen();
        }, true);

        // ============== YouTube IFrame API ==============
        (function loadYT() {
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        })();
        window.onYouTubeIframeAPIReady = function () {
            ytApiReady = true;
            if (pendingVideoId) { createPlayer(pendingVideoId); pendingVideoId = null; }
        };
        function startVideo(videoId) {
            if (ytApiReady) createPlayer(videoId); else pendingVideoId = videoId;
        }
        function createPlayer(videoId) {
            player = new YT.Player('ytplayer', {
                videoId: videoId,
                // fs: 0 hides YouTube's own full-screen button (and disables its "f" shortcut),
                // so the only way to go full screen is ours — which keeps the banner and info bar.
                // cc_load_policy turns captions on by default. cc_lang_pref is deliberately NOT set —
                // pinning a language removes Auto-translate from the player's caption menu.
                playerVars: { rel: 0, modestbranding: 1, playsinline: 1, enablejsapi: 1, fs: 0,
                             cc_load_policy: 1 },
                events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange }
            });
        }

        function onPlayerReady() {
            duration = Math.floor(player.getDuration());
            if (!duration || duration < 1) { setTimeout(onPlayerReady, 600); return; } // metadata not ready yet
            numCells = Math.max(1, Math.ceil(duration / CELL_SECONDS));
            covered = new Uint8Array(numCells);
            updateProgressUI();
            setInterval(sample, POLL_MS);
        }

        function onPlayerStateChange(e) {
            // 0 = ended, 2 = paused
            if (e.data === YT.PlayerState.ENDED || e.data === YT.PlayerState.PAUSED) {
                saveProgress(true);
            }
        }

        // ============== Coverage sampling (distinguishes watching from skipping) ==============
        function sample() {
            if (!player || !player.getPlayerState) return;
            if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;

            const now = player.getCurrentTime();
            const rate = player.getPlaybackRate ? player.getPlaybackRate() : 1;
            const cell = Math.min(numCells - 1, Math.floor(now / CELL_SECONDS));

            if (lastTime >= 0) {
                const advanced = now - lastTime;
                const expected = (POLL_MS / 1000) * rate;
                if (advanced > 0 && advanced <= expected + CELL_SECONDS * 1.5) {
                    // continuous playback: fill cells between last and now
                    const fromCell = Math.max(0, Math.floor(lastTime / CELL_SECONDS));
                    for (let c = fromCell; c <= cell; c++) covered[c] = 1;
                    watchTime += advanced;
                    dirty = true;
                } else {
                    // a seek/jump: only credit the landing cell
                    covered[cell] = 1; dirty = true;
                }
            } else {
                covered[cell] = 1; dirty = true;
            }
            lastTime = now;

            updateProgressUI();
            if (dirty && Date.now() - lastSave > SAVE_EVERY_MS) saveProgress(false);
        }

        function coveredCount() {
            let n = 0; for (let i = 0; i < numCells; i++) if (covered[i]) n++; return n;
        }
        function updateProgressUI() {
            if (!numCells) return;
            const pct = Math.round((coveredCount() / numCells) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPct').textContent = pct + '%';
            document.getElementById('doneTag').classList.toggle('hidden', pct < 100);
        }

        // ============== Write to Firestore ==============
        async function saveProgress(force) {
            if (!db || !session || !covered) return;
            if (!force && !dirty) return;
            dirty = false; lastSave = Date.now();
            try {
                let bits = '';
                for (let i = 0; i < numCells; i++) bits += covered[i] ? '1' : '0';
                const count = coveredCount();
                const percent = Math.round((count / numCells) * 100);
                const payload = {
                    className: session.className,
                    quizName: session.quizName,
                    databaseId: session.databaseId,
                    youtubeId: session.youtubeId,
                    studentName: session.name,
                    studentID: session.studentID,
                    maxAttempts: session.maxAttempts,
                    review: session.isReview,
                    duration: duration,
                    cellSeconds: CELL_SECONDS,
                    numCells: numCells,
                    coverage: bits,
                    cellsCovered: count,
                    percentWatched: percent,
                    watchTime: Math.round(watchTime),
                    completed: percent >= 100,
                    firstSeen: firstSeen || Date.now(),
                    lastUpdated: Date.now()
                };
                if (session.isReview) payload.reviewNum = session.reviewNum; else payload.attempt = session.attempt;
                await db.collection('videoProgress').doc(session.docId).set(payload);
            } catch (e) { console.error('Save failed:', e); dirty = true; }
        }

        // Best-effort save when leaving / backgrounding
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveProgress(true); });
        window.addEventListener('pagehide', () => saveProgress(true));
        window.addEventListener('beforeunload', () => saveProgress(true));
    </script>
</body>
